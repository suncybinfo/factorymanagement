<div class="page-header">
    <div class="page-header-left d-flex align-items-center">
        <div class="page-header-title">
            <h5 class="m-b-10">Master</h5>
        </div>
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="">Dashboard</a></li>
            <li class="breadcrumb-item">Branch Master</li>
        </ul>
    </div>
    <div class="page-header-right ms-auto">
        <div class="page-header-right-items">
            <div class="d-flex align-items-center gap-2 page-header-right-items-wrapper">
                <div class="dropdown filter-dropdown">
                    <a class="btn btn-primary" (click)="addRecord()"[class.disabled]="isButtonDisabled" [attr.aria-disabled]="isButtonDisabled" [style.pointer-events]="isButtonDisabled ? 'none' : 'auto'">
                        <i class="feather-plus me-2"></i>
                        <span>{{btnname}}</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

@if(isform){
    <div class="col-xl-12" style="padding: 10px 10px 0 10px;">
        <div class="card stretch stretch-full">
            <div class="card-body">
                <div class="row">
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">Branch Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Branch Name">
                    </div>
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">Branch Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Branch Code">
                    </div>
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">Branch Manager Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Branch Manager Name">
                    </div>
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">Branch Manager Mobile No. <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Branch Manager Mobile No.">
                    </div>
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">Branch Manager Email Id. <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Branch Manager Email Id.">
                    </div>
                     <div class="col-lg-3 mb-3">
                        <label class="form-label">Country <span class="text-danger">*</span></label>
                         <select class="form-control">
                            <option value="">Select Country</option>
                            <option value="1">State 1</option>
                            <option value="2">State 2</option>
                            <option value="3">State 3</option>
                        </select>
                    </div>
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">State <span class="text-danger">*</span></label>
                         <select class="form-control">
                            <option value="">Select Country</option>
                            <option value="1">State 1</option>
                            <option value="2">State 2</option>
                            <option value="3">State 3</option>
                        </select>
                    </div>
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">District <span class="text-danger">*</span></label>
                         <select class="form-control">
                            <option value="">Select Country</option>
                            <option value="1">State 1</option>
                            <option value="2">State 2</option>
                            <option value="3">State 3</option>
                        </select>
                    </div>
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">Address <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Address">
                    </div>
                </div>
            </div>
            <div class="card-footer">
            <div class="d-flex justify-content-center gap-2 mt-3">
                    <button class="btn btn-success">Submit</button>
                    <button class="btn btn-primary">Reset</button>
                    <button class="btn btn-danger" (click)="closedForm()">Close</button>
                </div>
            </div>
        </div>
    </div>
}
